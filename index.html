<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scan Barcode - Multi Barang dengan Panel Edit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Tab Navigation */
        .tab-nav {
            display: flex;
            background: white;
            border-radius: 10px 10px 0 0;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e9ecef;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #007bff;
            color: white;
        }
        .tab-btn:hover:not(.active) {
            background: #dee2e6;
        }
        
        /* Tab Content */
        .tab-content {
            background: white;
            padding: 20px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            min-height: 500px;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }
        
        h3 {
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
        }
        
        /* Form Tambah/Edit */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 13px;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.2s;
        }
        .form-group input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }
        .form-row {
            display: flex;
            gap: 8px;
        }
        .form-row .form-group {
            flex: 1;
        }
        
        /* Buttons */
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
            margin: 3px;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #1e7e34; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #bd2130; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-warning:hover { background: #e0a800; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-info:hover { background: #117a8b; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #545b62; }
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        
        /* Scanner Area */
        #reader {
            width: 100%;
            margin: 15px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #007bff;
        }
        .scan-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0;
        }
        .scan-result {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
            min-height: 40px;
        }
        
        /* Tabel */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 500px;
        }
        th {
            background: #007bff;
            color: white;
            padding: 8px;
            text-align: left;
            font-size: 12px;
        }
        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            font-size: 12px;
        }
        tr:nth-child(even) { background: #f8f9fa; }
        .status-dipinjam { 
            color: #dc3545; 
            font-weight: bold; 
        }
        .status-tersedia { 
            color: #28a745; 
        }
        .action-cell {
            white-space: nowrap;
        }
        
        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 350px;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .notif-success { background: #28a745; }
        .notif-error { background: #dc3545; }
        .notif-warning { background: #ffc107; color: #333; }
        
        .note {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="tab-scan">📷 Scan Barcode</button>
            <button class="tab-btn" data-tab="tab-edit">✏️ Edit Barang</button>
        </div>
        
        <div class="tab-content">
            <!-- ==================== TAB SCAN ==================== -->
            <div class="tab-panel active" id="tab-scan">
                <h3>📷 Scan Barcode Peminjaman</h3>
                
                <div id="reader"></div>
                
                <div class="scan-buttons">
                    <button class="btn btn-success" id="startBtn">▶ Mulai Kamera</button>
                    <button class="btn btn-danger" id="stopBtn" disabled>⏹ Stop Kamera</button>
                </div>
                
                <div class="scan-result" id="scanResult">
                    📡 Klik "Mulai Kamera" untuk memindai
                </div>
                
                <div class="table-wrapper">
                    <table id="tabelBarang">
                        <thead>
                            <tr>
                                <th>Nama Barang</th>
                                <th>Inventaris</th>
                                <th>Kode</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="bodyTabel"></tbody>
                    </table>
                </div>
                
                <div style="text-align: center; margin-top: 15px;">
                    <button class="btn btn-secondary" id="resetBtn">🔄 Reset Semua Status</button>
                    <button class="btn btn-info" id="exportBtn">📥 Export CSV</button>
                </div>
                
                <div class="note">
                    ⚡ Data tersimpan otomatis di browser (localStorage)
                </div>
            </div>
            
            <!-- ==================== TAB EDIT ==================== -->
            <div class="tab-panel" id="tab-edit">
                <h3>✏️ Kelola Data Barang</h3>
                
                <!-- Form Tambah/Edit -->
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <h4 id="formTitle" style="margin-bottom: 12px;">➕ Tambah Barang Baru</h4>
                    <input type="hidden" id="editIndex" value="-1">
                    
                    <div class="form-group">
                        <label>Nama Barang:</label>
                        <input type="text" id="inputNama" placeholder="Contoh: Laptop Dell Latitude">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nomor Inventaris:</label>
                            <input type="text" id="inputInventaris" placeholder="Contoh: INV-2024-001">
                        </div>
                        <div class="form-group">
                            <label>Kode Barcode:</label>
                            <input type="text" id="inputKode" placeholder="Contoh: BARCODE-001">
                        </div>
                    </div>
                    
                    <div style="margin-top: 10px;">
                        <button class="btn btn-success" id="btnSimpan">💾 Simpan</button>
                        <button class="btn btn-secondary" id="btnBatal" style="display:none;">❌ Batal Edit</button>
                        <button class="btn btn-warning" id="btnGenerate">🎲 Generate Kode Acak</button>
                    </div>
                </div>
                
                <!-- Import/Export -->
                <div style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap;">
                    <button class="btn btn-info btn-sm" id="btnImport">📥 Import CSV</button>
                    <button class="btn btn-info btn-sm" id="btnExportData">📤 Export Data CSV</button>
                    <button class="btn btn-danger btn-sm" id="btnHapusSemua">🗑 Hapus Semua</button>
                </div>
                <input type="file" id="fileImport" accept=".csv" style="display:none;">
                
                <!-- Tabel Edit Barang -->
                <div class="table-wrapper">
                    <table id="tabelEdit">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Barang</th>
                                <th>Inventaris</th>
                                <th>Kode Barcode</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="bodyTabelEdit"></tbody>
                    </table>
                </div>
                <div id="emptyMessage" style="text-align:center; padding: 30px; color: #888;">
                    📭 Belum ada barang. Tambahkan barang baru.
                </div>
            </div>
        </div>
    </div>
    
    <!-- Notification Container -->
    <div id="notification" class="notification" style="display:none;"></div>

    <!-- Library html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
    (function() {
        // ==========================================
        // DATA STORAGE (localStorage)
        // ==========================================
        const STORAGE_KEY_DATA = 'data_barang_inventaris';
        const STORAGE_KEY_STATUS = 'status_peminjaman';
        
        // Default data jika belum ada
        const DEFAULT_DATA = [
            { nama: "Laptop Dell Latitude", inventaris: "INV-2024-001", kode: "BARCODE-LAPTOP-001" },
            { nama: "Proyektor Epson", inventaris: "INV-2024-002", kode: "BARCODE-PROYEKTOR-002" },
            { nama: "Kamera Canon EOS", inventaris: "INV-2024-003", kode: "BARCODE-KAMERA-003" },
        ];
        
        // Load dari localStorage atau gunakan default
        let DATA_BARANG = JSON.parse(localStorage.getItem(STORAGE_KEY_DATA)) || DEFAULT_DATA;
        let statusPeminjaman = JSON.parse(localStorage.getItem(STORAGE_KEY_STATUS)) || {};
        
        // Inisialisasi status untuk barang baru
        function initStatus() {
            DATA_BARANG.forEach(barang => {
                if (!statusPeminjaman[barang.kode]) {
                    statusPeminjaman[barang.kode] = { dipinjam: false, waktu: null };
                }
            });
            // Hapus status barang yang sudah tidak ada
            Object.keys(statusPeminjaman).forEach(kode => {
                if (!DATA_BARANG.find(b => b.kode === kode)) {
                    delete statusPeminjaman[kode];
                }
            });
            saveData();
        }
        
        function saveData() {
            localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(DATA_BARANG));
            localStorage.setItem(STORAGE_KEY_STATUS, JSON.stringify(statusPeminjaman));
        }
        
        initStatus();
        
        // ==========================================
        // NOTIFICATION
        // ==========================================
        function showNotification(message, type = 'success') {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = `notification notif-${type}`;
            notif.style.display = 'block';
            clearTimeout(notif._timeout);
            notif._timeout = setTimeout(() => {
                notif.style.display = 'none';
            }, 3000);
        }
        
        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        // Tab
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabPanels = document.querySelectorAll('.tab-panel');
        
        // Scan Tab
        const readerDiv = document.getElementById('reader');
        const scanResult = document.getElementById('scanResult');
        const bodyTabel = document.getElementById('bodyTabel');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        
        // Edit Tab
        const formTitle = document.getElementById('formTitle');
        const editIndex = document.getElementById('editIndex');
        const inputNama = document.getElementById('inputNama');
        const inputInventaris = document.getElementById('inputInventaris');
        const inputKode = document.getElementById('inputKode');
        const btnSimpan = document.getElementById('btnSimpan');
        const btnBatal = document.getElementById('btnBatal');
        const btnGenerate = document.getElementById('btnGenerate');
        const bodyTabelEdit = document.getElementById('bodyTabelEdit');
        const emptyMessage = document.getElementById('emptyMessage');
        const btnImport = document.getElementById('btnImport');
        const btnExportData = document.getElementById('btnExportData');
        const btnHapusSemua = document.getElementById('btnHapusSemua');
        const fileImport = document.getElementById('fileImport');
        
        let html5QrCode = null;
        let lastScannedCode = null;
        let lastScanTime = 0;
        
        // ==========================================
        // TAB SWITCHING
        // ==========================================
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const tabId = this.getAttribute('data-tab');
                
                // Update active button
                tabBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Update active panel
                tabPanels.forEach(p => p.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
                
                // Jika pindah dari tab scan, hentikan scanner
                if (tabId !== 'tab-scan') {
                    stopScanning();
                }
                
                // Render ulang tabel edit
                if (tabId === 'tab-edit') {
                    renderTabelEdit();
                }
            });
        });
        
        // ==========================================
        // FORMAT
        // ==========================================
        function formatDateTime(date) {
            if (!date) return '-';
            const d = new Date(date);
            const options = { 
                day: 'numeric', month: 'long', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            };
            return d.toLocaleDateString('id-ID', options).replace('pukul', 'jam');
        }
        
        // ==========================================
        // RENDER TABEL SCAN
        // ==========================================
        function renderTabelScan() {
            bodyTabel.innerHTML = '';
            
            DATA_BARANG.forEach(barang => {
                const status = statusPeminjaman[barang.kode] || { dipinjam: false, waktu: null };
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>${barang.nama}</td>
                    <td>${barang.inventaris}</td>
                    <td style="font-size:11px;font-family:monospace;">${barang.kode}</td>
                    <td>
                        ${status.dipinjam 
                            ? `<span class="status-dipinjam">📌 Dipinjam</span><br><small>${formatDateTime(status.waktu)}</small>`
                            : '<span class="status-tersedia">✅ Tersedia</span>'
                        }
                    </td>
                `;
                bodyTabel.appendChild(tr);
            });
        }
        
        // ==========================================
        // RENDER TABEL EDIT
        // ==========================================
        function renderTabelEdit() {
            bodyTabelEdit.innerHTML = '';
            
            if (DATA_BARANG.length === 0) {
                emptyMessage.style.display = 'block';
            } else {
                emptyMessage.style.display = 'none';
            }
            
            DATA_BARANG.forEach((barang, index) => {
                const status = statusPeminjaman[barang.kode] || { dipinjam: false, waktu: null };
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${barang.nama}</td>
                    <td>${barang.inventaris}</td>
                    <td style="font-size:11px;font-family:monospace;">${barang.kode}</td>
                    <td>
                        ${status.dipinjam 
                            ? '<span class="status-dipinjam">📌 Dipinjam</span>'
                            : '<span class="status-tersedia">✅ Tersedia</span>'
                        }
                    </td>
                    <td class="action-cell">
                        <button class="btn btn-warning btn-sm btn-edit" data-index="${index}">✏️ Edit</button>
                        <button class="btn btn-danger btn-sm btn-hapus" data-index="${index}">🗑 Hapus</button>
                    </td>
                `;
                bodyTabelEdit.appendChild(tr);
            });
            
            // Event listener untuk tombol edit & hapus
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    editBarang(index);
                });
            });
            
            document.querySelectorAll('.btn-hapus').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    hapusBarang(index);
                });
            });
        }
        
        // ==========================================
        // CRUD BARANG
        // ==========================================
        function resetForm() {
            editIndex.value = '-1';
            inputNama.value = '';
            inputInventaris.value = '';
            inputKode.value = '';
            formTitle.textContent = '➕ Tambah Barang Baru';
            btnBatal.style.display = 'none';
            btnSimpan.textContent = '💾 Simpan';
        }
        
        function editBarang(index) {
            const barang = DATA_BARANG[index];
            editIndex.value = index;
            inputNama.value = barang.nama;
            inputInventaris.value = barang.inventaris;
            inputKode.value = barang.kode;
            formTitle.textContent = `✏️ Edit: ${barang.nama}`;
            btnBatal.style.display = 'inline-block';
            btnSimpan.textContent = '💾 Update';
            
            // Scroll ke form
            document.getElementById('tab-edit').scrollIntoView({ behavior: 'smooth' });
            inputNama.focus();
        }
        
        function hapusBarang(index) {
            const barang = DATA_BARANG[index];
            if (!confirm(`Yakin hapus "${barang.nama}" (${barang.inventaris})?`)) return;
            
            // Hapus dari status
            delete statusPeminjaman[barang.kode];
            
            // Hapus dari data
            DATA_BARANG.splice(index, 1);
            saveData();
            
            renderTabelEdit();
            renderTabelScan();
            showNotification(`✅ "${barang.nama}" berhasil dihapus`, 'success');
        }
        
        btnSimpan.addEventListener('click', function() {
            const nama = inputNama.value.trim();
            const inventaris = inputInventaris.value.trim();
            const kode = inputKode.value.trim();
            
            // Validasi
            if (!nama) { showNotification('❌ Nama barang harus diisi!', 'error'); return; }
            if (!inventaris) { showNotification('❌ Nomor inventaris harus diisi!', 'error'); return; }
            if (!kode) { showNotification('❌ Kode barcode harus diisi!', 'error'); return; }
            
            const idx = parseInt(editIndex.value);
            
            if (idx >= 0) {
                // Mode Edit
                const kodeLama = DATA_BARANG[idx].kode;
                
                // Cek duplikat kode (kecuali kode sendiri)
                if (kode !== kodeLama && DATA_BARANG.find(b => b.kode === kode)) {
                    showNotification('❌ Kode barcode sudah ada! Gunakan kode lain.', 'error');
                    return;
                }
                
                // Update status jika kode berubah
                if (kode !== kodeLama) {
                    statusPeminjaman[kode] = statusPeminjaman[kodeLama] || { dipinjam: false, waktu: null };
                    delete statusPeminjaman[kodeLama];
                }
                
                DATA_BARANG[idx] = { nama, inventaris, kode };
                showNotification(`✅ "${nama}" berhasil diupdate!`, 'success');
            } else {
                // Mode Tambah
                if (DATA_BARANG.find(b => b.kode === kode)) {
                    showNotification('❌ Kode barcode sudah ada! Gunakan kode lain.', 'error');
                    return;
                }
                
                DATA_BARANG.push({ nama, inventaris, kode });
                statusPeminjaman[kode] = { dipinjam: false, waktu: null };
                showNotification(`✅ "${nama}" berhasil ditambahkan!`, 'success');
            }
            
            saveData();
            resetForm();
            renderTabelEdit();
            renderTabelScan();
        });
        
        btnBatal.addEventListener('click', resetForm);
        
        btnGenerate.addEventListener('click', function() {
            const randomCode = 'BC-' + Math.random().toString(36).substring(2, 10).toUpperCase();
            inputKode.value = randomCode;
            showNotification('🎲 Kode acak digenerate!', 'warning');
        });
        
        btnHapusSemua.addEventListener('click', function() {
            if (!confirm('⚠️ Yakin hapus SEMUA barang? Data tidak bisa dikembalikan!')) return;
            if (!confirm('Klik OK lagi untuk konfirmasi.')) return;
            
            DATA_BARANG = [];
            statusPeminjaman = {};
            saveData();
            resetForm();
            renderTabelEdit();
            renderTabelScan();
            showNotification('🗑 Semua barang dihapus', 'warning');
        });
        
        // ==========================================
        // IMPORT / EXPORT CSV
        // ==========================================
        btnImport.addEventListener('click', function() {
            fileImport.click();
        });
        
        fileImport.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const text = event.target.result;
                    const lines = text.split('\n').filter(line => line.trim());
                    
                    if (lines.length < 2) {
                        showNotification('❌ File CSV kosong atau format salah', 'error');
                        return;
                    }
                    
                    let imported = 0;
                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(',');
                        if (cols.length >= 3) {
                            const nama = cols[0].replace(/"/g, '').trim();
                            const inventaris = cols[1].replace(/"/g, '').trim();
                            const kode = cols[2].replace(/"/g, '').trim();
                            
                            if (nama && inventaris && kode && !DATA_BARANG.find(b => b.kode === kode)) {
                                DATA_BARANG.push({ nama, inventaris, kode });
                                statusPeminjaman[kode] = { dipinjam: false, waktu: null };
                                imported++;
                            }
                        }
                    }
                    
                    saveData();
                    renderTabelEdit();
                    renderTabelScan();
                    showNotification(`📥 ${imported} barang berhasil diimport!`, 'success');
                } catch (err) {
                    showNotification('❌ Gagal membaca file CSV', 'error');
                }
            };
            reader.readAsText(file);
            fileImport.value = '';
        });
        
        btnExportData.addEventListener('click', function() {
            let csv = 'Nama Barang,Inventaris,Kode Barcode\n';
            DATA_BARANG.forEach(b => {
                csv += `"${b.nama}","${b.inventaris}","${b.kode}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `data_barang_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(url);
            showNotification('📤 Data barang diexport!', 'success');
        });
        
        // ==========================================
        // SCANNER
        // ==========================================
        function pinjamBarang(kode) {
            const barang = DATA_BARANG.find(b => b.kode === kode);
            
            if (!barang) {
                scanResult.innerHTML = `❌ Kode <strong>"${kode}"</strong> tidak terdaftar`;
                scanResult.style.background = '#f8d7da';
                scanResult.style.borderColor = '#dc3545';
                showNotification(`❌ Kode tidak terdaftar: ${kode}`, 'error');
                return false;
            }
            
            const status = statusPeminjaman[kode];
            
            if (status.dipinjam) {
                scanResult.innerHTML = `⚠️ <strong>${barang.nama}</strong> (${barang.inventaris})<br>SUDAH dipinjam sejak ${formatDateTime(status.waktu)}`;
                scanResult.style.background = '#fff3cd';
                scanResult.style.borderColor = '#ffc107';
                showNotification(`⚠️ ${barang.nama} sudah dipinjam`, 'warning');
                return false;
            }
            
            status.dipinjam = true;
            status.waktu = new Date().toISOString();
            saveData();
            
            scanResult.innerHTML = `✅ <strong>${barang.nama}</strong> (${barang.inventaris})<br>📅 Dipinjam: ${formatDateTime(status.waktu)}`;
            scanResult.style.background = '#d4edda';
            scanResult.style.borderColor = '#28a745';
            
            renderTabelScan();
            showNotification(`✅ ${barang.nama} berhasil dipinjam!`, 'success');
            return true;
        }
        
        function onScanSuccess(decodedText) {
            const kode = decodedText.trim();
            const now = Date.now();
            
            if (kode === lastScannedCode && (now - lastScanTime) < 2000) return;
            lastScannedCode = kode;
            lastScanTime = now;
            
            pinjamBarang(kode);
        }
        
        function onScanError(error) {}
        
        function startScanning() {
            if (html5QrCode) html5QrCode.clear();
            
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                onScanSuccess,
                onScanError
            )
            .then(() => {
                startBtn.disabled = true;
                stopBtn.disabled = false;
                scanResult.innerHTML = '📡 Kamera aktif, arahkan ke barcode...';
                scanResult.style.background = '#fff3cd';
                scanResult.style.borderColor = '#ffc107';
            })
            .catch(err => {
                let pesan = 'Gagal mengakses kamera.\n\n';
                if (err.name === 'NotAllowedError') pesan += '❌ Izin kamera ditolak.';
                else if (err.name === 'NotFoundError') pesan += '📷 Kamera tidak ditemukan.';
                else pesan += err.message;
                showNotification(pesan, 'error');
            });
        }
        
        function stopScanning() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    scanResult.innerHTML = '📡 Scanner dihentikan';
                    scanResult.style.background = '#e2e3e5';
                    scanResult.style.borderColor = '#adb5bd';
                }).catch(() => {});
            }
        }
        
        function resetSemua() {
            if (!confirm('Yakin reset SEMUA status peminjaman?')) return;
            
            Object.keys(statusPeminjaman).forEach(kode => {
                statusPeminjaman[kode] = { dipinjam: false, waktu: null };
            });
            saveData();
            renderTabelScan();
            renderTabelEdit();
            scanResult.innerHTML = '📡 Semua status direset';
            scanResult.style.background = '#fff3cd';
            scanResult.style.borderColor = '#ffc107';
            lastScannedCode = null;
            lastScanTime = 0;
            showNotification('🔄 Semua status direset', 'warning');
        }
        
        function exportCSV() {
            let csv = 'Nama Barang,Inventaris,Kode Barcode,Status,Tanggal Pinjam\n';
            DATA_BARANG.forEach(barang => {
                const status = statusPeminjaman[barang.kode] || { dipinjam: false, waktu: null };
                csv += `"${barang.nama}","${barang.inventaris}","${barang.kode}","${status.dipinjam ? 'Dipinjam' : 'Tersedia'}","${status.waktu ? formatDateTime(status.waktu) : '-'}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `laporan_peminjaman_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(url);
            showNotification('📥 Laporan diexport!', 'success');
        }
        
        // ==========================================
        // EVENT LISTENERS
        // ==========================================
        startBtn.addEventListener('click', startScanning);
        stopBtn.addEventListener('click', stopScanning);
        resetBtn.addEventListener('click', resetSemua);
        exportBtn.addEventListener('click', exportCSV);
        
        window.addEventListener('beforeunload', () => {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(() => {});
            }
        });
        
        // ==========================================
        // INITIAL RENDER
        // ==========================================
        renderTabelScan();
        renderTabelEdit();
        
        console.log('✅ Sistem siap!');
        console.log('📦 Total barang:', DATA_BARANG.length);
        console.log('💾 Data tersimpan di localStorage');
    })();
    </script>
</body>
</html>
